#fff;border:none;padding:12px;border-radius:5px;cursor:pointer;font-size:16px;font-weight:700;margin-bottom:10px}.login-btn:hover{background:#0056b3}.login-error{color:red;text-align:center;margin-bottom:15px;font-size:14px}.generator-content{display:none}</style></head><body><div id=loginModal><div class=login-content><h2>Admin Login</h2><div class=login-error id=loginError></div><input id=loginUsername placeholder=Username class=login-input required> <input type=password id=loginPassword placeholder=Password class=login-input required><button class=login-btn onclick=login()>Login</button><div style=text-align:center;font-size:14px;color:#666>Default: Username = 800, Password = 20</div></div></div><div class="container generator-content" id=generatorContent><div style=display:flex;justify-content:space-between;align-items:center;margin-bottom:20px><h1>Login ID Generator</h1><button class=generate-btn onclick=logout() style=background:#dc3545>Logout</button></div><div class=credential><div class=label>Dealer Code (8-digit)</div><div style=margin-bottom:10px><input id=customDealerCode placeholder="Enter 8-digit dealer code" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:5px;font-size:18px" maxlength=8 pattern=\d{8} required><small style=color:#666;display:block;margin-top:5px>Enter 8-digit dealer code</small></div><div class=value><span id=dealerCode>--</span><button class=copy-btn onclick="copyToClipboard('dealerCode')">Copy</button></div></div><div class=credential><div class=label>PIN (4-digit)</div><div style=margin-bottom:10px><input type=password id=customPin placeholder="Enter 4-digit PIN" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:5px;font-size:18px" maxlength=4 pattern=\d{4} required><small style=color:#666;display:block;margin-top:5px>Enter 4-digit PIN</small></div><div class=value><span id=pin>--</span><button class=copy-btn onclick="copyToClipboard('pin')">Copy</button></div></div><div style=display:flex;gap:10p
